version: '3.8'

services:
  # Redis service to host cache layers, rate-limiting counters, and task queue streams
  redis:
    image: redis:7-alpine
    container_name: yt-extractor-redis
    # Run Redis with maxmemory constraints and a noeviction policy to ensure BullMQ queue integrity
    command: redis-server --maxmemory ${REDIS_MAX_MEMORY:-256mb} --maxmemory-policy ${REDIS_MAX_MEMORY_POLICY:-noeviction}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # The primary Express REST API backend server
  api:
    build: .
    container_name: yt-extractor-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:5173}
      - MAX_WORKERS=${MAX_WORKERS:-4}
      - EXTRACTION_TIMEOUT=${EXTRACTION_TIMEOUT:-25000}
      - YT_DLP_PATH=${YT_DLP_PATH:-yt-dlp}
      - USE_TOR=${USE_TOR:-false}
      - WEBSHARE_PROXIES=${WEBSHARE_PROXIES}
      - ORACLE_PROXIES=${ORACLE_PROXIES}
      - YT_COOKIES_BASE64=${YT_COOKIES_BASE64}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network
    # Production resource limitations to prevent CPU/memory hijacking by massive jobs
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-2}'
          memory: ${MEMORY_LIMIT:-512M}
        reservations:
          cpus: '${CPU_RESERVATION:-1}'
          memory: ${MEMORY_RESERVATION:-256M}

  # Secondary Tor proxy container (optional fallback for automated proxy rotation)
  tor:
    image: dperson/torproxy:latest
    container_name: yt-extractor-tor
    restart: unless-stopped
    networks:
      - app_network
    ports:
      - "${TOR_PORT:-9050}:9050"

volumes:
  redis_data:

networks:
  app_network:
    driver: bridge
